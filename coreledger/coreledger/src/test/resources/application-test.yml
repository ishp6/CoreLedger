spring:
  datasource:
    url: jdbc:h2:mem:coreledger;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect

jwt:
  secret: "test-secret-key-for-jwt-signing-must-be-at-least-32-bytes-long"
  expiration-minutes: 60
